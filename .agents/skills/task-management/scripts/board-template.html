<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Board</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2129;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--accent:#58a6ff;--pri-critical:#f85149;--pri-high:#db6d28;--pri-medium:#58a6ff;--pri-low:#8b949e;--clr-agent:#58a6ff;--clr-human:#d2a8ff;--clr-both:#7ee787}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface)}
header h1{font-size:20px;font-weight:600}
.stats{display:flex;gap:16px;font-size:13px;color:var(--dim)}
.stats span{display:flex;align-items:center;gap:4px}
.toolbar{padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center}
.toolbar button{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;font-size:13px;transition:all .15s}
.toolbar button:hover{background:var(--surface2);color:var(--text)}
.toolbar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.board{display:flex;gap:16px;padding:20px 24px;overflow-x:auto;min-height:calc(100vh - 120px);align-items:flex-start}
.column{min-width:280px;max-width:340px;flex:1;background:var(--surface);border-radius:8px;border:1px solid var(--border);display:flex;flex-direction:column;max-height:calc(100vh - 140px)}
.col-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;border-radius:8px 8px 0 0}
.col-head h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.col-head .cnt{background:var(--border);color:var(--dim);font-size:11px;padding:2px 8px;border-radius:10px}
.column[data-s="open"] .col-head{border-top:3px solid var(--dim)}
.column[data-s="doing"] .col-head{border-top:3px solid var(--accent)}
.column[data-s="review"] .col-head{border-top:3px solid #d29922}
.column[data-s="blocked"] .col-head{border-top:3px solid #bc8cff}
.column[data-s="done"] .col-head{border-top:3px solid #3fb950}
.column[data-s="cancelled"] .col-head{border-top:3px solid var(--pri-critical)}
.col-body{padding:8px;overflow-y:auto;flex:1}
.card{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.card:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.card-id{font-size:12px;color:var(--dim);font-family:monospace}
.pri{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;text-transform:uppercase}
.pri.critical{background:rgba(248,81,73,.15);color:var(--pri-critical)}
.pri.high{background:rgba(219,109,40,.15);color:var(--pri-high)}
.pri.medium{background:rgba(88,166,255,.15);color:var(--pri-medium)}
.pri.low{background:rgba(139,148,158,.15);color:var(--pri-low)}
.card-title{font-size:14px;font-weight:500;line-height:1.4;margin-bottom:8px}
.card-meta{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--dim);gap:8px}
.asn{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap}
.asn.agent{background:rgba(88,166,255,.15);color:var(--clr-agent)}
.asn.human{background:rgba(210,168,255,.15);color:var(--clr-human)}
.asn.both{background:rgba(126,231,135,.15);color:var(--clr-both)}
.dl{color:var(--accent);text-decoration:none;cursor:pointer}
.dl:hover{text-decoration:underline}
.pbar{width:60px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;flex-shrink:0}
.pbar-fill{height:100%;background:#3fb950;border-radius:3px;transition:width .3s}
.empty{padding:16px;text-align:center;color:var(--dim);font-size:13px;font-style:italic}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:90%;max-width:720px;max-height:85vh;overflow-y:auto;padding:24px}
.m-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.m-head h2{font-size:20px;font-weight:600}
.m-close{background:none;border:none;color:var(--dim);font-size:24px;cursor:pointer;padding:0 4px}
.m-close:hover{color:var(--text)}
.m-meta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.mt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
.mt strong{color:var(--text)}
.m-sec{margin-bottom:20px}
.m-sec h3{font-size:14px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.m-sec .desc{font-size:14px;line-height:1.6;color:var(--text)}
.pi{display:flex;align-items:flex-start;gap:8px;font-size:14px;padding:4px 0;line-height:1.5}
.pi input[type=checkbox]{margin-top:4px;accent-color:var(--accent)}
.pi.done{color:var(--dim);text-decoration:line-through}
.le{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.le:last-child{border-bottom:none}
.lt{font-size:11px;color:var(--dim);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.la{padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600}
.la.agent{background:rgba(88,166,255,.15);color:var(--clr-agent)}
.la.human{background:rgba(210,168,255,.15);color:var(--clr-human)}
.le blockquote{border-left:3px solid var(--border);padding-left:10px;color:var(--text);line-height:1.5}
.result-box{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.3);border-radius:6px;padding:10px 14px;font-size:13px;color:#3fb950;margin-top:8px}
@media(max-width:768px){.board{flex-direction:column}.column{max-width:100%;min-width:unset;max-height:unset}}
</style>
</head>
<body>

<header>
  <h1>📋 Task Board</h1>
  <div class="stats" id="stats"></div>
</header>

<div class="toolbar">
  <button class="active" data-f="all">All</button>
  <button data-f="agent">🤖 Agent</button>
  <button data-f="human">👤 Human</button>
  <button data-f="both">🤖👤 Both</button>
</div>

<div class="board" id="board"></div>

<div class="overlay" id="ov">
  <div class="modal" id="md"></div>
</div>

<script>
// __TASK_DATA__

const SO=['open','doing','review','blocked','done','cancelled'];
const SL={open:'Open',doing:'In Progress',review:'Review',blocked:'Blocked',done:'Done',cancelled:'Cancelled'};
const SI={open:'⚪',doing:'🔵',review:'🟠',blocked:'🟣',done:'✅',cancelled:'❌'};
const PW={critical:0,high:1,medium:2,low:3};
let CF='all';

const h=s=>s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):'';
const pad=n=>String(n).padStart(3,'0');
const fmtDate=iso=>{if(!iso||iso==='null')return'—';return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const ago=iso=>{if(!iso||iso==='null')return'';const s=Math.floor((Date.now()-new Date(iso))/1000);if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';if(s<2592000)return Math.floor(s/86400)+'d';return fmtDate(iso)};
const asnIcon=a=>a==='agent'?'🤖':a==='human'?'👤':'🤖👤';
const prog=t=>{if(!t.plan_items||!t.plan_items.length)return null;const d=t.plan_items.filter(i=>i.checked).length;return{d,t:t.plan_items.length,p:Math.round(d/t.plan_items.length*100)}};

function render(){
  const ts=CF==='all'?TASKS:TASKS.filter(t=>t.assignee===CF);
  const bd=document.getElementById('board');bd.innerHTML='';
  const ac=ts.filter(t=>!['done','cancelled'].includes(t.status)).length;
  const dc=ts.filter(t=>t.status==='done').length;
  const bc=ts.filter(t=>t.status==='blocked').length;
  document.getElementById('stats').innerHTML=`<span>📦 ${ts.length} total</span><span>🔵 ${ac} active</span><span>✅ ${dc} done</span>${bc?`<span>🟣 ${bc} blocked</span>`:''}`;

  for(const st of SO){
    const items=ts.filter(t=>t.status===st).sort((a,b)=>(PW[a.priority]??9)-(PW[b.priority]??9)||a.id-b.id);
    const col=document.createElement('div');col.className='column';col.dataset.s=st;
    col.innerHTML=`<div class="col-head"><h2>${SI[st]} ${SL[st]}</h2><span class="cnt">${items.length}</span></div><div class="col-body"></div>`;
    bd.appendChild(col);
    const cb=col.querySelector('.col-body');
    if(!items.length){cb.innerHTML='<div class="empty">No tasks</div>';continue}
    for(const t of items){
      const pg=prog(t);
      const deps=t.depends_on&&t.depends_on.length?`<span>↳ <a class="dl" onclick="openTask(${t.depends_on[0]})">#${pad(t.depends_on[0])}</a></span>`:'';
      cb.insertAdjacentHTML('beforeend',`<div class="card" onclick="openTask(${t.id})"><div class="card-top"><span class="card-id">#${pad(t.id)}</span><span class="pri ${t.priority}">${t.priority}</span></div><div class="card-title">${h(t.title)}</div><div class="card-meta"><span class="asn ${t.assignee}">${asnIcon(t.assignee)} ${t.assignee}</span>${deps}${pg?`<span class="pbar"><span class="pbar-fill" style="width:${pg.p}%"></span></span>`:''}</div></div>`);
    }
  }
}

function openTask(id){
  const t=TASKS.find(x=>x.id===id);if(!t)return;
  const pg=prog(t);
  const deps=t.depends_on&&t.depends_on.length?t.depends_on.map(d=>`<a class="dl" onclick="openTask(${d})">#${pad(d)}</a>`).join(', '):'None';
  let body='';
  if(t.context_text)body+=`<div class="m-sec"><h3>Context</h3><div class="desc">${h(t.context_text)}</div></div>`;
  if(t.description)body+=`<div class="m-sec"><h3>Description</h3><div class="desc">${h(t.description)}</div></div>`;
  if(t.plan_items&&t.plan_items.length)body+=`<div class="m-sec"><h3>Plan${pg?` (${pg.d}/${pg.t})`:''}</h3>${t.plan_items.map(i=>`<div class="pi${i.checked?' done':''}"><input type="checkbox"${i.checked?' checked':''} disabled><span>${h(i.text)}</span></div>`).join('')}</div>`;
  if(t.result)body+=`<div class="m-sec"><h3>Result</h3><div class="result-box">${h(t.result)}</div></div>`;
  if(t.log_entries&&t.log_entries.length)body+=`<div class="m-sec"><h3>Log</h3>${t.log_entries.map(e=>`<div class="le"><div class="lt">${e.timestamp}<span class="la ${e.author}">${e.author}</span></div><blockquote>${h(e.message)}</blockquote></div>`).join('')}</div>`;

  document.getElementById('md').innerHTML=`<div class="m-head"><h2>${SI[t.status]} #${pad(t.id)} — ${h(t.title)}</h2><button class="m-close" onclick="closeModal()">&times;</button></div><div class="m-meta"><span class="mt">⏱ <strong>${ago(t.updated_at)}</strong></span><span class="mt">📅 Created <strong>${fmtDate(t.created_at)}</strong></span><span class="mt">👤 <strong>${t.assignee}</strong></span><span class="mt">🔗 Depends: <strong>${deps}</strong></span>${t.branch?`<span class="mt">🌿 <strong>${h(t.branch)}</strong></span>`:''}</div>${body}`;
  document.getElementById('ov').classList.add('show');
}

function closeModal(){document.getElementById('ov').classList.remove('show')}
document.getElementById('ov').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

document.querySelectorAll('.toolbar button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');CF=btn.dataset.f;render();
  });
});

render();
</script>
</body>
</html>
