name: Build & Release CV PDF

on:
  push:
    branches: [main]
    paths-ignore:
      - "LICENSE"
      - ".wordlist"
      - ".gitignore"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── Job 1: Lint (parallel, lightweight) ──────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install lint tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq chktex aspell aspell-en > /dev/null 2>&1

      - name: LaTeX lint (chktex)
        id: latex
        continue-on-error: true
        run: |
          OUTPUT=$(chktex -q -n1 -n6 -n8 -n13 -n15 -n18 -n36 -n38 -n39 -n44 main.tex 2>/dev/null || true)
          if [ -n "$OUTPUT" ]; then
            {
              echo "result=❌ Failed"
              echo "details<<EOF"
              echo "$OUTPUT"
              echo "EOF"
            } > /tmp/lint_latex.txt
            echo "$OUTPUT"
            exit 1
          fi
          echo "result=✅ Passed" > /tmp/lint_latex.txt

      - name: Spell check (aspell)
        id: spell
        continue-on-error: true
        run: |
          # Build aspell personal dictionary from .wordlist
          echo "personal_ws-1.1 en 0" > /tmp/cv.dict
          grep -v '^#' .wordlist >> /tmp/cv.dict 2>/dev/null || true

          # Extract words from LaTeX, run aspell, filter false positives
          OUTPUT=$(cat main.tex \
            | sed 's/\\[a-zA-Z]*{[^}]*}//g' \
            | aspell list --lang=en --encoding=utf-8 --personal=/tmp/cv.dict \
            | grep -viE '(https?://|\\[a-z]+)' \
            | sort -u || true)

          if [ -n "$OUTPUT" ]; then
            COUNT=$(echo "$OUTPUT" | wc -l | tr -d ' ')
            {
              echo "result=❌ Failed (${COUNT} misspelled word(s))"
              echo "details<<EOF"
              echo "$OUTPUT"
              echo "EOF"
            } > /tmp/lint_spell.txt
            echo "Misspelled words:"
            echo "$OUTPUT"
            exit 1
          fi
          echo "result=✅ Passed" > /tmp/lint_spell.txt

      - name: Link checker
        id: links
        continue-on-error: true
        run: |
          RESULTS=""
          TOTAL=0
          FAIL=0
          while IFS= read -r url; do
            TOTAL=$((TOTAL + 1))
            STATUS=$(curl -sI -o /dev/null -w "%{http_code}" -L --max-time 10 "$url" 2>/dev/null || echo "000")
            if { [ "$STATUS" -ge 400 ] && [ "$STATUS" -ne 403 ] && [ "$STATUS" -ne 999 ]; } || [ "$STATUS" = "000" ]; then
              RESULTS="${RESULTS}- ❌ ${url} → HTTP ${STATUS}"$'\n'
              FAIL=$((FAIL + 1))
            else
              RESULTS="${RESULTS}- ✅ ${url} → HTTP ${STATUS}"$'\n'
            fi
          done < <(grep -oE 'https?://[^} )\\]+' main.tex | sort -u)
          if [ "$FAIL" -gt 0 ]; then
            {
              echo "result=❌ Failed (${FAIL}/${TOTAL})"
              echo "details<<EOF"
              echo "${RESULTS}"
              echo "EOF"
            } > /tmp/lint_links.txt
            echo "${RESULTS}"
            exit 1
          fi
          echo "result=✅ Passed (${TOTAL}/${TOTAL})" > /tmp/lint_links.txt

      - name: Generate lint summary
        if: always()
        run: |
          LATEX_RES=$(cat /tmp/lint_latex.txt 2>/dev/null | head -1 | sed 's/^result=//' || echo '⚠️ Skipped')
          SPELL_RES=$(cat /tmp/lint_spell.txt 2>/dev/null | head -1 | sed 's/^result=//' || echo '⚠️ Skipped')
          LINKS_RES=$(cat /tmp/lint_links.txt 2>/dev/null | head -1 | sed 's/^result=//' || echo '⚠️ Skipped')

          # Overall verdict
          ALL_PASS=true
          for res in "$LATEX_RES" "$SPELL_RES" "$LINKS_RES"; do
            echo "$res" | grep -q "Failed" && ALL_PASS=false
          done

          if [ "$ALL_PASS" = true ]; then
            echo "### ✅ All lint checks passed" > $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some lint checks failed" > $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|:------|:-------|" >> $GITHUB_STEP_SUMMARY
          echo "| LaTeX lint (chktex) | ${LATEX_RES} |" >> $GITHUB_STEP_SUMMARY
          echo "| Spell check (aspell) | ${SPELL_RES} |" >> $GITHUB_STEP_SUMMARY
          echo "| Link checker | ${LINKS_RES} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Detailed sections for failures
          for f in /tmp/lint_latex.txt /tmp/lint_spell.txt /tmp/lint_links.txt; do
            [ ! -f "$f" ] && continue
            RES=$(head -1 "$f" | sed 's/^result=//')
            if echo "$RES" | grep -q "Failed"; then
              NAME=""
              case "$f" in
                */lint_latex.txt) NAME="LaTeX Lint" ;;
                */lint_spell.txt) NAME="Spell Check" ;;
                */lint_links.txt) NAME="Link Checker" ;;
              esac
              echo "<details><summary><strong>${NAME} — Details</strong></summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -n +2 "$f" | grep -v '^details<<EOF$' | grep -v '^EOF$' >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

          # Fail job if any check failed
          for res in "$LATEX_RES" "$SPELL_RES" "$LINKS_RES"; do
            if echo "$res" | grep -q "Failed"; then
              exit 1
            fi
          done

  # ── Job 2: Build (runs on both push and PR) ──────────────────────
  build:
    runs-on: ubuntu-latest
    container:
      image: danteev/texlive:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build PDF (pass 1)
        run: |
          mkdir -p out
          xelatex -interaction=nonstopmode -output-directory=out main.tex
        id: build1

      - name: Build PDF (pass 2)
        run: |
          xelatex -interaction=nonstopmode -output-directory=out main.tex
        id: build2

      - name: Install PDF tools
        run: apt-get update -qq && apt-get install -y -qq poppler-utils > /dev/null 2>&1

      - name: Page count check
        id: pages
        continue-on-error: true
        run: |
          PAGES=$(pdfinfo out/main.pdf | awk '/Pages/{print $2}')
          if [ "$PAGES" -gt 2 ]; then
            echo "result=❌ Failed (${PAGES} pages, max 2)" > /tmp/build_pages.txt
            echo "CV exceeds 2 pages ($PAGES)"
            exit 1
          fi
          echo "result=✅ Passed (${PAGES} page(s))" > /tmp/build_pages.txt

      - name: ATS text validation
        id: ats
        continue-on-error: true
        run: |
          TEXT=$(pdftotext out/main.pdf -)
          MISSING=""
          for SECTION in "EXPERIENCE" "EDUCATION" "SKILLS"; do
            if ! echo "$TEXT" | grep -qi "$SECTION"; then
              MISSING="$MISSING $SECTION"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "result=❌ Failed — missing:${MISSING}" > /tmp/build_ats.txt
            echo "ATS: sections not found: ${MISSING}"
            exit 1
          fi
          echo "result=✅ Passed (EXPERIENCE, EDUCATION, SKILLS)" > /tmp/build_ats.txt

      - name: Compute PDF fingerprint
        id: fingerprint
        run: |
          HASH=$(sha256sum out/main.pdf | awk '{print $1}')
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          SHORT=$(echo "$HASH" | cut -c1-16)
          echo "$SHORT" > /tmp/build_hash.txt
          echo "PDF fingerprint: ${SHORT}..."

      - name: Convert to HTML & Markdown
        id: convert
        continue-on-error: true
        run: |
          chmod +x convert.sh
          ./convert.sh all
          echo "✅ HTML and Markdown generated"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: cv-pdf
          path: out/main.pdf
          retention-days: 30

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v7
        with:
          name: cv-html
          path: out/main.html
          retention-days: 30

      - name: Upload Markdown artifact
        uses: actions/upload-artifact@v7
        with:
          name: cv-md
          path: out/main.md
          retention-days: 30

      - name: Generate build summary
        if: always()
        run: |
          PAGES_RES=$(cat /tmp/build_pages.txt 2>/dev/null | head -1 | sed 's/^result=//' || echo '⚠️ Skipped')
          ATS_RES=$(cat /tmp/build_ats.txt 2>/dev/null | head -1 | sed 's/^result=//' || echo '⚠️ Skipped')
          PDF_SIZE=$(du -h out/main.pdf 2>/dev/null | awk '{print $1}' || echo 'unknown')
          PDF_HASH=$(cat /tmp/build_hash.txt 2>/dev/null || echo 'unknown')
          HTML_SIZE=$(du -h out/main.html 2>/dev/null | awk '{print $1}' || echo 'skipped')
          MD_SIZE=$(du -h out/main.md 2>/dev/null | awk '{print $1}' || echo 'skipped')
          CONVERT_RES="✅ Passed"
          if [ ! -f out/main.html ] || [ ! -f out/main.md ]; then
            CONVERT_RES="⚠️ Skipped (pandoc not available)"
          fi

          # Overall verdict
          BUILD_PASS=true
          for res in "$PAGES_RES" "$ATS_RES"; do
            echo "$res" | grep -q "Failed" && BUILD_PASS=false
          done

          if [ "$BUILD_PASS" = true ]; then
            echo "### ✅ Build checks passed" > $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Build checks failed" > $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|:------|:-------|" >> $GITHUB_STEP_SUMMARY
          echo "| PDF compilation | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Page count (max 2) | ${PAGES_RES} |" >> $GITHUB_STEP_SUMMARY
          echo "| ATS text validation | ${ATS_RES} |" >> $GITHUB_STEP_SUMMARY
          echo "| HTML/MD conversion | ${CONVERT_RES} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "<details><summary><strong>Output files</strong></summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|:-----|:-----|" >> $GITHUB_STEP_SUMMARY
          echo "| \`main.pdf\` | \`${PDF_SIZE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`main.html\` | \`${HTML_SIZE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`main.md\` | \`${MD_SIZE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| PDF SHA-256 | \`${PDF_HASH}\` |" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Fail job if any check failed
          for res in "$PAGES_RES" "$ATS_RES"; do
            if echo "$res" | grep -q "Failed"; then
              exit 1
            fi
          done

  # ── Job 3: Visual diff on PRs ────────────────────────────────────
  diff:
    if: github.event_name == 'pull_request'
    needs: [build, lint]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download built PDF
        uses: actions/download-artifact@v8
        with:
          name: cv-pdf
          path: ./new

      - name: Download built HTML
        uses: actions/download-artifact@v8
        with:
          name: cv-html
          path: ./new

      - name: Download latest release PDF
        id: prev_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release list -L 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          if [ -n "$LATEST" ]; then
            gh release download "$LATEST" --pattern '*.pdf' -D ./old || true
            echo "tag=${LATEST}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Install diff tools
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils > /dev/null 2>&1

      - name: Generate visual diff
        run: |
          mkdir -p diff-output

          if ls ./old/*.pdf 1>/dev/null 2>&1; then
            OLD_PDF=$(ls ./old/*.pdf | head -1)
            NEW_PDF=./new/main.pdf

            mkdir -p old-pages new-pages
            pdftoppm -png -r 150 "$OLD_PDF" old-pages/page
            pdftoppm -png -r 150 "$NEW_PDF" new-pages/page

            cp old-pages/*.png diff-output/ 2>/dev/null || true
            cp new-pages/*.png diff-output/ 2>/dev/null || true
          else
            echo "No previous release found — uploading new PDF pages only."
            pdftoppm -png -r 150 ./new/main.pdf diff-output/new-page
          fi

          # Include HTML in diff artifact for review
          cp ./new/main.html diff-output/cv.html 2>/dev/null || true

      - name: Upload diff artifact
        uses: actions/upload-artifact@v7
        with:
          name: cv-visual-diff
          path: diff-output/
          retention-days: 14

      - name: Generate diff summary
        if: always()
        run: |
          NEW_PAGES=$(ls diff-output/new-page*.png 2>/dev/null | wc -l | tr -d ' ')
          OLD_TAG="${{ steps.prev_release.outputs.tag }}"

          echo "### 🔍 Visual Diff" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$OLD_TAG" != "none" ]; then
            OLD_PAGES=$(ls diff-output/page*.png 2>/dev/null | grep -v 'new-page' | wc -l | tr -d ' ')
            echo "Comparing against **${OLD_TAG}**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| | Pages |" >> $GITHUB_STEP_SUMMARY
            echo "|:--|:------|" >> $GITHUB_STEP_SUMMARY
            echo "| Previous (\`${OLD_TAG}\`) | ${OLD_PAGES} |" >> $GITHUB_STEP_SUMMARY
            echo "| This PR | ${NEW_PAGES} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "No previous release found — this is the first build." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "New PDF has **${NEW_PAGES} page(s)**." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 📥 Download the **cv-visual-diff** artifact for side-by-side page images and the HTML version." >> $GITHUB_STEP_SUMMARY

  # ── Job 4: Release (only on push to main) ────────────────────────
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, lint]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download built PDF
        uses: actions/download-artifact@v8
        with:
          name: cv-pdf
          path: ./out

      - name: Download built Markdown
        uses: actions/download-artifact@v8
        with:
          name: cv-md
          path: ./out

      - name: Download built HTML
        uses: actions/download-artifact@v8
        with:
          name: cv-html
          path: ./out

      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="$(date +%Y.%m)"
          COUNT=$(gh release list --limit 100 --json tagName -q ".[].tagName" | grep -c "^v${PREFIX}\." || true)
          PATCH=$((COUNT + 1))
          VERSION="${PREFIX}.${PATCH}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Next release: ${TAG}"

          if gh release view "${TAG}" 2>/dev/null; then
            echo "::error::Release ${TAG} already exists! Aborting."
            exit 1
          fi

      - name: Check for content changes
        id: content_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_HASH=$(sha256sum out/main.pdf | awk '{print $1}')
          echo "new_hash=${NEW_HASH}" >> "$GITHUB_OUTPUT"

          LATEST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          if [ -n "$LATEST_TAG" ]; then
            gh release download "$LATEST_TAG" --pattern '*.pdf' -D ./old-release || true
            if ls ./old-release/*.pdf 1>/dev/null 2>&1; then
              OLD_HASH=$(sha256sum ./old-release/*.pdf | awk '{print $1}')
              echo "old_hash=${OLD_HASH}" >> "$GITHUB_OUTPUT"
              if [ "$NEW_HASH" = "$OLD_HASH" ]; then
                echo "changed=false" >> "$GITHUB_OUTPUT"
                echo "⚠️ PDF content is identical to last release (${LATEST_TAG})"
              else
                echo "changed=true" >> "$GITHUB_OUTPUT"
                echo "✅ PDF content differs from last release (${LATEST_TAG})"
              fi
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "✅ Could not download previous release — proceeding"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ No previous release — first release"
          fi

      - name: Skip release (no content changes)
        if: steps.content_check.outputs.changed == 'false'
        run: |
          echo "### ⏭️ Release Skipped" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "PDF content is identical to the latest release. No new release needed." >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: Generate release notes
        if: steps.content_check.outputs.changed != 'false'
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          git fetch --tags --prune-tags

          if [ -n "$PREV_TAG" ]; then
            echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
            COMMITS=$(git log "${PREV_TAG}"..HEAD --pretty=format:"%s" --no-merges)
          else
            echo "prev_tag=none" >> "$GITHUB_OUTPUT"
            COMMITS=$(git log --pretty=format:"%s" --no-merges)
          fi

          # Categorize commits by conventional commit type
          FEATURES=""
          FIXES=""
          DOCS=""
          CHORES=""
          REFACTOR=""
          OTHER=""
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            case "$msg" in
              cv:*|feat:*)    FEATURES="${FEATURES}- ${msg}"$'\n' ;;
              fix:*)          FIXES="${FIXES}- ${msg}"$'\n' ;;
              docs:*)         DOCS="${DOCS}- ${msg}"$'\n' ;;
              chore:*|ci:*)   CHORES="${CHORES}- ${msg}"$'\n' ;;
              refactor:*)     REFACTOR="${REFACTOR}- ${msg}"$'\n' ;;
              *)              OTHER="${OTHER}- ${msg}"$'\n' ;;
            esac
          done <<< "$COMMITS"

          # Build structured notes
          NOTES=""
          if [ -n "$FEATURES" ]; then
            NOTES="${NOTES}### Changed"$'\n'"${FEATURES}"$'\n'
          fi
          if [ -n "$FIXES" ]; then
            NOTES="${NOTES}### Fixed"$'\n'"${FIXES}"$'\n'
          fi
          if [ -n "$DOCS" ]; then
            NOTES="${NOTES}### Documentation"$'\n'"${DOCS}"$'\n'
          fi
          if [ -n "$CHORES" ]; then
            NOTES="${NOTES}### Maintenance"$'\n'"${CHORES}"$'\n'
          fi
          if [ -n "$REFACTOR" ]; then
            NOTES="${NOTES}### Refactored"$'\n'"${REFACTOR}"$'\n'
          fi
          if [ -n "$OTHER" ]; then
            NOTES="${NOTES}### Other"$'\n'"${OTHER}"$'\n'
          fi
          NOTES=$(echo "$NOTES" | sed '/^$/d')

          {
            echo "notes<<RELEASE_EOF"
            echo "$NOTES"
            echo ""
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

          # Generate release summary
          echo "### 🚀 Released \`${{ steps.version.outputs.tag }}\`" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:-------|:------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| PDF | \`Victor_Busque_CV_${{ steps.version.outputs.version }}.pdf\` |" >> $GITHUB_STEP_SUMMARY
          echo "| HTML | \`Victor_Busque_CV_${{ steps.version.outputs.version }}.html\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Previous | ${PREV_TAG:-none} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "$NOTES" ]; then
            echo "<details><summary><strong>Changelog</strong></summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "$NOTES" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Rename outputs with version
        if: steps.content_check.outputs.changed != 'false'
        run: |
          cp out/main.pdf "Victor_Busque_CV_${{ steps.version.outputs.version }}.pdf"
          cp out/main.html "Victor_Busque_CV_${{ steps.version.outputs.version }}.html"
          cp out/main.md llms.txt

      - name: Create GitHub Release
        if: steps.content_check.outputs.changed != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "Victor_Busque_CV_${{ steps.version.outputs.version }}.pdf" \
            "Victor_Busque_CV_${{ steps.version.outputs.version }}.html" \
            llms.txt \
            --title "CV ${{ steps.version.outputs.version }}" \
            --notes "## Changes since ${{ steps.changelog.outputs.prev_tag }}

          ${{ steps.changelog.outputs.notes }}"
