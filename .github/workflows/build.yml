name: Build & Release CV PDF

on:
  push:
    branches: [main]
    paths-ignore:
      - "LICENSE"
      - ".wordlist"
      - ".gitignore"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── Job 1: Lint (parallel, lightweight) ──────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq chktex > /dev/null 2>&1

      - name: LaTeX lint (chktex)
        id: latex
        continue-on-error: true
        run: |
          OUTPUT=$(chktex -q -n1 -n6 -n13 -n15 -n36 -n44 main.tex 2>/dev/null || true)
          if [ -n "$OUTPUT" ]; then
            {
              echo "result=❌ Failed"
              echo "details<<EOF"
              echo "$OUTPUT"
              echo "EOF"
            } > /tmp/lint_latex.txt
            echo "$OUTPUT"
            exit 1
          fi
          echo "result=✅ Passed" > /tmp/lint_latex.txt

      - name: Link checker
        id: links
        continue-on-error: true
        run: |
          RESULTS=""
          TOTAL=0
          FAIL=0
          while IFS= read -r url; do
            TOTAL=$((TOTAL + 1))
            STATUS=$(curl -sI -o /dev/null -w "%{http_code}" -L --max-time 10 "$url" 2>/dev/null || echo "000")
            if [ "$STATUS" -ge 400 ] || [ "$STATUS" = "000" ]; then
              RESULTS="${RESULTS}- ❌ ${url} → HTTP ${STATUS}"$'\n'
              FAIL=$((FAIL + 1))
            else
              RESULTS="${RESULTS}- ✅ ${url} → HTTP ${STATUS}"$'\n'
            fi
          done < <(grep -oE 'https?://[^} )\\]+' main.tex | sort -u)
          if [ "$FAIL" -gt 0 ]; then
            {
              echo "result=❌ Failed (${FAIL}/${TOTAL})"
              echo "details<<EOF"
              echo "${RESULTS}"
              echo "EOF"
            } > /tmp/lint_links.txt
            echo "${RESULTS}"
            exit 1
          fi
          echo "result=✅ Passed (${TOTAL}/${TOTAL})" > /tmp/lint_links.txt

      - name: Generate lint summary
        if: always()
        run: |
          LATEX_RES=$(cat /tmp/lint_latex.txt 2>/dev/null | head -1 | sed 's/^result=//' || echo '⚠️ Skipped')
          LINKS_RES=$(cat /tmp/lint_links.txt 2>/dev/null | head -1 | sed 's/^result=//' || echo '⚠️ Skipped')

          cat > $GITHUB_STEP_SUMMARY << 'SUMEOF'
          ## 🧪 CV Lint Checks

          | Check | Result |
          |---|---|
          SUMEOF
          echo "| LaTeX lint (chktex) | ${LATEX_RES} |" >> $GITHUB_STEP_SUMMARY
          echo "| Link checker | ${LINKS_RES} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Detailed sections
          for f in /tmp/lint_latex.txt /tmp/lint_links.txt; do
            [ ! -f "$f" ] && continue
            RES=$(head -1 "$f" | sed 's/^result=//')
            if echo "$RES" | grep -q "Failed"; then
              NAME=""
              case "$f" in
                */lint_latex.txt) NAME="LaTeX Lint" ;;
                */lint_links.txt) NAME="Link Checker" ;;
              esac
              echo "<details><summary><strong>${NAME} — Details</strong></summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -n +2 "$f" | grep -v '^details<<EOF$' | grep -v '^EOF$' >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

          # Fail job if any check failed
          for res in "$LATEX_RES" "$LINKS_RES"; do
            if echo "$res" | grep -q "Failed"; then
              exit 1
            fi
          done

  # ── Job 2: Build (runs on both push and PR) ──────────────────────
  build:
    runs-on: ubuntu-latest
    container:
      image: danteev/texlive:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PDF (pass 1)
        run: |
          mkdir -p out
          xelatex -interaction=nonstopmode -output-directory=out main.tex
        id: build1

      - name: Build PDF (pass 2)
        run: |
          xelatex -interaction=nonstopmode -output-directory=out main.tex
        id: build2

      - name: Install PDF tools
        run: apt-get update -qq && apt-get install -y -qq poppler-utils > /dev/null 2>&1

      - name: Page count check
        id: pages
        continue-on-error: true
        run: |
          PAGES=$(pdfinfo out/main.pdf | awk '/Pages/{print $2}')
          if [ "$PAGES" -gt 2 ]; then
            echo "result=❌ Failed (${PAGES} pages, max 2)" > /tmp/build_pages.txt
            echo "CV exceeds 2 pages ($PAGES)"
            exit 1
          fi
          echo "result=✅ Passed (${PAGES} page(s))" > /tmp/build_pages.txt

      - name: ATS text validation
        id: ats
        continue-on-error: true
        run: |
          TEXT=$(pdftotext out/main.pdf -)
          MISSING=""
          for SECTION in "EXPERIENCE" "EDUCATION" "SKILLS"; do
            if ! echo "$TEXT" | grep -qi "$SECTION"; then
              MISSING="$MISSING $SECTION"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "result=❌ Failed — missing:${MISSING}" > /tmp/build_ats.txt
            echo "ATS: sections not found: ${MISSING}"
            exit 1
          fi
          echo "result=✅ Passed (EXPERIENCE, EDUCATION, SKILLS)" > /tmp/build_ats.txt

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: cv-pdf
          path: out/main.pdf
          retention-days: 5

      - name: Generate build summary
        if: always()
        run: |
          PAGES_RES=$(cat /tmp/build_pages.txt 2>/dev/null | head -1 | sed 's/^result=//' || echo '⚠️ Skipped')
          ATS_RES=$(cat /tmp/build_ats.txt 2>/dev/null | head -1 | sed 's/^result=//' || echo '⚠️ Skipped')

          cat >> $GITHUB_STEP_SUMMARY << SUMEOF

          ## 📄 CV Build

          | Check | Result |
          |---|---|
          | PDF compilation | ✅ Passed |
          | Page count | ${PAGES_RES} |
          | ATS text validation | ${ATS_RES} |
          SUMEOF

          # Fail job if any check failed
          for res in "$PAGES_RES" "$ATS_RES"; do
            if echo "$res" | grep -q "Failed"; then
              exit 1
            fi
          done
  # ── Job 3: Visual diff on PRs ────────────────────────────────────
  diff:
    if: github.event_name == 'pull_request'
    needs: [build, lint]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built PDF
        uses: actions/download-artifact@v8
        with:
          name: cv-pdf
          path: ./new

      - name: Download latest release PDF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release list -L 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          if [ -n "$LATEST" ]; then
            gh release download "$LATEST" --pattern '*.pdf' -D ./old || true
          fi

      - name: Install diff tools
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils > /dev/null 2>&1

      - name: Generate visual diff
        run: |
          mkdir -p diff-output

          if ls ./old/*.pdf 1>/dev/null 2>&1; then
            OLD_PDF=$(ls ./old/*.pdf | head -1)
            NEW_PDF=./new/main.pdf

            mkdir -p old-pages new-pages
            pdftoppm -png -r 150 "$OLD_PDF" old-pages/page
            pdftoppm -png -r 150 "$NEW_PDF" new-pages/page

            cp old-pages/*.png diff-output/ 2>/dev/null || true
            cp new-pages/*.png diff-output/ 2>/dev/null || true
          else
            echo "No previous release found — uploading new PDF pages only."
            pdftoppm -png -r 150 ./new/main.pdf diff-output/new-page
          fi

      - name: Upload diff artifact
        uses: actions/upload-artifact@v7
        with:
          name: cv-visual-diff
          path: diff-output/
          retention-days: 14

  # ── Job 4: Release (only on push to main) ────────────────────────
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, lint]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built PDF
        uses: actions/download-artifact@v8
        with:
          name: cv-pdf
          path: ./out

      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="$(date +%Y.%m)"
          COUNT=$(gh release list --limit 100 --json tagName -q ".[].tagName" | grep -c "^v${PREFIX}\." || true)
          PATCH=$((COUNT + 1))
          VERSION="${PREFIX}.${PATCH}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Next release: ${TAG}"

          if gh release view "${TAG}" 2>/dev/null; then
            echo "::error::Release ${TAG} already exists! Aborting."
            exit 1
          fi

      - name: Generate release notes
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          git fetch --tags --prune-tags

          if [ -n "$PREV_TAG" ]; then
            echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
            NOTES=$(git log "${PREV_TAG}"..HEAD --pretty=format:"- %s" --no-merges)
          else
            echo "prev_tag=none" >> "$GITHUB_OUTPUT"
            NOTES=$(git log --pretty=format:"- %s" --no-merges)
          fi

          {
            echo "notes<<RELEASE_EOF"
            echo "$NOTES"
            echo ""
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Rename PDF with version
        run: |
          cp out/main.pdf "Victor_Busque_CV_${{ steps.version.outputs.version }}.pdf"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "Victor_Busque_CV_${{ steps.version.outputs.version }}.pdf" \
            --title "CV ${{ steps.version.outputs.version }}" \
            --notes "## Changes since ${{ steps.changelog.outputs.prev_tag }}

          ${{ steps.changelog.outputs.notes }}"
