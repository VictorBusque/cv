name: Build & Release CV PDF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── Job 1: Build (runs on both push and PR) ──────────────────────
  build:
    runs-on: ubuntu-latest
    container:
      image: danteev/texlive:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PDF (pass 1)
        run: |
          mkdir -p out
          xelatex -interaction=nonstopmode -output-directory=out main.tex

      - name: Build PDF (pass 2)
        run: |
          xelatex -interaction=nonstopmode -output-directory=out main.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: out/main.pdf
          retention-days: 5

  # ── Job 2: Visual diff on PRs ────────────────────────────────────
  diff:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built PDF
        uses: actions/download-artifact@v4
        with:
          name: cv-pdf
          path: ./new

      - name: Download latest release PDF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release list -L 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          if [ -n "$LATEST" ]; then
            gh release download "$LATEST" --pattern '*.pdf' -D ./old || true
          fi

      - name: Install diff tools
        run: |
          apt-get update && apt-get install -y poppler-utils diffutils > /dev/null 2>&1

      - name: Generate visual diff
        run: |
          mkdir -p diff-output

          if [ -f ./old/*.pdf ]; then
            OLD_PDF=$(ls ./old/*.pdf | head -1)
            NEW_PDF=$(ls ./new/main.pdf)

            # Convert both PDFs to images for visual comparison
            mkdir -p old-pages new-pages
            pdftoppm -png -r 150 "$OLD_PDF" old-pages/page
            pdftoppm -png -r 150 "$NEW_PDF" new-pages/page

            # Pixel-level diff per page
            shopt -s nullglob
            for img in new-pages/*.png; do
              base=$(basename "$img")
              page_num=$(echo "$base" | grep -oP '\d+')
              old_img="old-pages/old-${page_num}.png"

              if [ -f "$old_img" ]; then
                # Use ImageMagick compare if available, otherwise just list both
                compare -metric AE "$old_img" "$img" "diff-output/diff-page-${page_num}.png" 2>/dev/null || true
              fi
            done

            # Also store side-by-side copies for manual review
            cp old-pages/*.png diff-output/ 2>/dev/null || true
            cp new-pages/*.png diff-output/ 2>/dev/null || true
          else
            echo "No previous release found — skipping diff, new PDF only."
            pdftoppm -png -r 150 ./new/main.pdf diff-output/new-page
          fi

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-visual-diff
          path: diff-output/
          retention-days: 14

  # ── Job 3: Release (only on push to main) ────────────────────────
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    container:
      image: danteev/texlive:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built PDF
        uses: actions/download-artifact@v4
        with:
          name: cv-pdf
          path: ./out

      - name: Compute next version
        id: version
        run: |
          PREFIX="$(date +%Y.%m)"
          COUNT=$(git tag -l "${PREFIX}.*" | wc -l | tr -d ' ')
          PATCH=$((COUNT + 1))
          VERSION="${PREFIX}.${PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next release: ${VERSION}"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -1)
          if [ -n "$PREV_TAG" ]; then
            echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
            NOTES=$(git log "${PREV_TAG}"..HEAD --pretty=format:"- %s" --no-merges)
          else
            echo "prev_tag=none" >> "$GITHUB_OUTPUT"
            NOTES=$(git log --pretty=format:"- %s" --no-merges)
          fi

          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Rename PDF with version
        run: |
          cp out/main.pdf "Victor_Busque_CV_${{ steps.version.outputs.version }}.pdf"

      - name: Update CHANGELOG.md
        run: |
          DATE=$(date +%Y-%m-%d)
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="${{ steps.changelog.outputs.notes }}"
          PREV="${{ steps.changelog.outputs.prev_tag }}"

          # Create or prepend to CHANGELOG.md
          ENTRY="## v${VERSION} (${DATE})"$'\n\n'"${NOTES}"

          if [ -f CHANGELOG.md ]; then
            # Prepend new entry after the header
            {
              echo "# Changelog"
              echo ""
              echo "$ENTRY"
              echo ""
              # Remove old header and keep the rest
              sed '1,/^# Changelog/d' CHANGELOG.md | sed '1,/^$/d'
            } > CHANGELOG.md.new
            mv CHANGELOG.md.new CHANGELOG.md
          else
            {
              echo "# Changelog"
              echo ""
              echo "$ENTRY"
            } > CHANGELOG.md
          fi

      - name: Commit CHANGELOG.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update CHANGELOG.md for v${{ steps.version.outputs.version }}"
          file_pattern: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "CV ${{ steps.version.outputs.version }}"
          body: |
            ## Changes since ${{ steps.changelog.outputs.prev_tag }}

            ${{ steps.changelog.outputs.notes }}
          files: |
            Victor_Busque_CV_${{ steps.version.outputs.version }}.pdf
